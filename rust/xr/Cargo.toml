[package]
name = "xr"
version = "4.0.0"
edition = "2021"
rust-version = "1.80"
description = "XRouter Android host-side control plane (SukiSU / KernelSU)"
license = "GPL-3.0-only"

[[bin]]
name = "xr"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
regex = { version = "1.11", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
rustix = { version = "1.0", default-features = false, features = ["std", "fs", "process", "system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.6"
tempfile = "3.19"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
