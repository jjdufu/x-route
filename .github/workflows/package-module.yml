name: Package SuKiSU Module (Lite Zip & Shell Check)

# 只做检查与打包 Lite 包，不发布 Release。
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-module:
    name: Validate Scripts & Build SuKiSU Lite Module Zip
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (WebUI)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci --prefix webui --no-fund --no-audit

      - name: Setup Rust (aarch64-unknown-linux-musl)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xr

      - name: Install shellcheck & musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zip mksh busybox musl-tools file

      - name: Lint (shellcheck + sh -n + rust + config keys)
        run: sh scripts/lint.sh


      - name: Setup Java (notifier jar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (d8 + android.jar for notifier jar)
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_HOME"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/clt "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/clt
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Package SuKiSU Lite Module Zip
        run: |
          if [ -f scripts/package-module.sh ]; then
            bash scripts/package-module.sh --lite-only
          else
            echo "package-module.sh not present yet, skip"
          fi

      - name: Upload SuKiSU Lite Module Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xrouter-sukisu-lite-module
          path: dist/xrouter-sukisu-lite-*.zip
          if-no-files-found: warn
