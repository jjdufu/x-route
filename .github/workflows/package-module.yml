name: Package SuKiSU Module (Lite Zip & Shell Check)

# 只做检查与打包 Lite 包，不发布 Release。
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-module:
    name: Validate Scripts & Build SuKiSU Lite Module Zip
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zip mksh busybox

      - name: Lint (shellcheck + sh -n + config keys)
        run: sh scripts/lint.sh

      - name: Package SuKiSU Lite Module Zip
        run: |
          if [ -f scripts/package-module.sh ]; then
            bash scripts/package-module.sh --lite-only
          else
            echo "package-module.sh not present yet, skip"
          fi

      - name: Upload SuKiSU Lite Module Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-route-sukisu-lite-module
          path: dist/x-route-sukisu-lite-*.zip
          if-no-files-found: warn
