name: Build ImmortalWrt ARM64 (Gunyah pVM)

# push 到 main 时构建并发布 Release；在其他分支手动触发只构建、上传 artifact，不发布。
# 其他分支的日常检查由 package-module.yml 完成。
# Tag 规则沿用历史：<module.prop version>-build.<run_number>。
# 发布为正式版（非预发布），并标记为 Latest。
# 虚拟机镜像（内核 Image + rootfs）只在镜像输入变化时重建：
#   镜像指纹 = openwrt/** 与 build-kernel.sh / build-rootfs.sh 的 git 对象哈希；
#   先查 Actions 缓存，再查最近几个 Release 里指纹相同的镜像（校验 sha256 后复用），都没有才重新构建。
#   手动触发时可勾选 rebuild_image 强制重建。
on:
  push:
    branches:
      - main
    paths:
      - 'openwrt/**'
      - 'module/**'
      - 'rust/**'
      - 'scripts/**'
      - 'webui/**'
      - '.github/workflows/build-openwrt.yml'
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: 强制重建虚拟机镜像（忽略缓存与上个 Release）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-openwrt:
    name: Build Kernel 6.12 + ImmortalWrt 25.12.2 Rootfs & SuKiSU Module Zip
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js (WebUI)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci --prefix webui --no-fund --no-audit

      - name: Setup Rust (aarch64-unknown-linux-musl)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xr

      - name: Install Build Dependencies & ARM64 Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex gawk cpio kmod \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu musl-tools \
            libssl-dev libelf-dev python3 rsync unzip zip file wget curl \
            zstd xz-utils e2fsprogs qemu-utils shellcheck mksh busybox

      - name: Lint
        run: sh scripts/lint.sh

      - name: Image Fingerprint
        id: img
        run: |
          KEY="$(git ls-files -s openwrt scripts/build-kernel.sh scripts/build-rootfs.sh | sha256sum | cut -c1-24)"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"
          echo "镜像指纹 ${KEY}"

      - name: Restore Image Cache
        id: imgcache
        if: ${{ !inputs.rebuild_image }}
        uses: actions/cache/restore@v4
        with:
          key: openwrt-image-${{ steps.img.outputs.key }}
          path: |
            dist/openwrt/Image
            dist/openwrt/openwrt-rootfs.img.gz
            dist/openwrt/openwrt.qcow2
            dist/openwrt/image.key

      - name: Reuse Image From Previous Release
        id: rel
        if: ${{ !inputs.rebuild_image && steps.imgcache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.img.outputs.key }}
        run: |
          set -u
          mkdir -p dist/openwrt /tmp/rel
          for tag in $(gh release list --limit 10 --exclude-drafts --json tagName -q '.[].tagName'); do
            rm -rf /tmp/rel/*
            gh release download "$tag" -p image.key -D /tmp/rel >/dev/null 2>&1 || continue
            [ "$(cat /tmp/rel/image.key)" = "$KEY" ] || continue
            gh release download "$tag" -p Image -p openwrt-rootfs.img.gz -p openwrt.qcow2 -p sha256sums.txt -D /tmp/rel || continue
            if ( cd /tmp/rel && grep -E ' (Image|openwrt-rootfs\.img\.gz|openwrt\.qcow2)$' sha256sums.txt | sha256sum -c - ); then
              cp /tmp/rel/Image /tmp/rel/openwrt-rootfs.img.gz /tmp/rel/openwrt.qcow2 /tmp/rel/image.key dist/openwrt/
              echo "hit=true" >> "$GITHUB_OUTPUT"
              echo "复用 ${tag} 的虚拟机镜像（指纹 ${KEY}）"
              exit 0
            fi
          done
          echo "没有指纹相同的旧镜像，重新构建"

      - name: Build Kernel (Image, Linux 6.12.103 + Gunyah pVM config)
        id: build
        if: ${{ inputs.rebuild_image || (steps.imgcache.outputs.cache-hit != 'true' && steps.rel.outputs.hit != 'true') }}
        run: bash scripts/build-kernel.sh

      - name: Build Rootfs (ImmortalWrt 25.12.2 ImageBuilder)
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          bash scripts/build-rootfs.sh
          echo "${{ steps.img.outputs.key }}" > dist/openwrt/image.key

      - name: Save Image Cache
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          key: openwrt-image-${{ steps.img.outputs.key }}
          path: |
            dist/openwrt/Image
            dist/openwrt/openwrt-rootfs.img.gz
            dist/openwrt/openwrt.qcow2
            dist/openwrt/image.key


      - name: Setup Java (notifier jar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (d8 + android.jar for notifier jar)
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_HOME"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/clt "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/clt
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Package SuKiSU Module (Lite & Full All-in-One Zip)
        run: bash scripts/package-module.sh

      - name: Upload Firmware & SuKiSU Module Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrouter-openwrt-and-sukisu-module
          path: |
            dist/xrouter-sukisu-*.zip
            dist/openwrt/Image
            dist/openwrt/openwrt-rootfs.img.gz
            dist/openwrt/openwrt.qcow2
            dist/openwrt/sha256sums.txt
            dist/openwrt/image.key
          if-no-files-found: error

      - name: Read Module Metadata
        id: meta
        run: |
          VER="$(awk -F= '/^version=/{print $2}' module/module.prop | tr -d '\r ')"
          NAME="$(awk -F= '/^name=/{print substr($0, index($0,$2))}' module/module.prop | tr -d '\r')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}-build.${{ github.run_number }}
          name: "${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}"
          prerelease: false
          make_latest: "true"
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/xrouter-sukisu-*.zip
            dist/openwrt/Image
            dist/openwrt/openwrt-rootfs.img.gz
            dist/openwrt/openwrt.qcow2
            dist/openwrt/sha256sums.txt
            dist/openwrt/image.key
