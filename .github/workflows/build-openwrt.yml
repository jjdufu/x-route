name: Build ImmortalWrt ARM64 (OnePlus 13 Gunyah & QEMU)

on:
  push:
    branches:
      - main
    paths:
      - 'openwrt-config/**'
      - 'scripts/build-openwrt.sh'
      - '.github/workflows/build-openwrt.yml'
  workflow_dispatch:
    inputs:
      immortalwrt_branch:
        description: 'ImmortalWrt branch to build'
        required: true
        default: 'openwrt-24.10'
      create_release:
        description: 'Publish artifacts to GitHub Releases'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build-openwrt:
    name: Compile Minimal ImmortalWrt (armsr/armv8 + Gunyah pVM)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout x-route repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3-setuptools python3-pyelftools rsync \
            swig unzip zlib1g-dev file wget curl qemu-utils zstd

      - name: Prepare & Verify Configuration
        run: |
          chmod +x scripts/build-openwrt.sh
          ./scripts/build-openwrt.sh \
            --branch "${{ inputs.immortalwrt_branch || 'openwrt-24.10' }}" \
            --prepare-only

      - name: Compile ImmortalWrt Kernel (Image) & Rootfs
        run: |
          ./scripts/build-openwrt.sh \
            --branch "${{ inputs.immortalwrt_branch || 'openwrt-24.10' }}" \
            --jobs "$(nproc)"

      - name: Package SuKiSU Module (Lite & Full All-in-One Zip)
        run: |
          chmod +x scripts/package-module.sh
          ./scripts/package-module.sh

      - name: Upload Firmware & SuKiSU Module Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-route-openwrt-and-sukisu-module
          path: |
            dist/x-route-sukisu-*.zip
            dist/openwrt/Image
            dist/openwrt/openwrt-rootfs.img.gz
            dist/openwrt/openwrt.qcow2
            dist/openwrt/sha256sums.txt
          if-no-files-found: error

      - name: Publish Release (on workflow_dispatch or tag)
        if: ${{ inputs.create_release == true || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-${{ github.run_number }}
          name: "x-route ImmortalWrt ARM64 & SuKiSU Module (Build #${{ github.run_number }})"
          body: |
            ### x-route All-in-One SuKiSU Module & Custom ImmortalWrt ARM64 Firmware
            - **One-Click Flashable Module**: `x-route-sukisu-full-v1.0.0.zip` (includes SuKiSU scripts, WebUI, 4-Layer Keep-Alive & compiled OpenWrt `Image` + `openwrt-rootfs.img.gz`)
            - **Target**: `armsr/armv8` (Linux 6.6)
            - **OnePlus 13 (SM8750) Gunyah pVM Adaptation**: `CONFIG_DMA_RESTRICTED_POOL=y`, `CONFIG_SWIOTLB=y`
            - **Built-in Drivers**: `virtio-net`, `virtio-blk`, `virtio-pci`, `virtio-fs`, `virtio-9p`, `tun`, `8250` (`ttyS0`) + `PL011` (`ttyAMA0`)
            - **Pre-installed Packages**: `luci` (zh-cn), `dnsmasq-full`, `firewall4` (`nftables` + `TTL=64` anti-detection), `openvpn-openssl` + `luci-app-openvpn`, `openlist` + `luci-app-openlist`, `ttyd`
            - **Default LAN**: `192.168.100.1/24` (`eth1` / MAC `52:54:00:12:34:57`)
            - **Default WAN**: `172.16.1.2/24` -> Gateway `172.16.1.1` (`eth0` / MAC `52:54:00:12:34:56`)
          files: |
            dist/x-route-sukisu-*.zip
            dist/openwrt/Image
            dist/openwrt/openwrt-rootfs.img.gz
            dist/openwrt/openwrt.qcow2
            dist/openwrt/sha256sums.txt
