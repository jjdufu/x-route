name: Build ImmortalWrt ARM64 (OnePlus 13 Gunyah pVM)

# 只有 main 分支（或手动触发）才会构建并发布 Release；其他分支只跑 package-module.yml 的检查。
# Tag 规则沿用历史：<module.prop version>-build.<run_number>。
# 发布为 prerelease：在真机验证通过之前，不标记为正式版。
on:
  push:
    branches:
      - main
    paths:
      - 'openwrt/**'
      - 'module/**'
      - 'scripts/**'
      - '.github/workflows/build-openwrt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-openwrt:
    name: Build Kernel 6.12 + ImmortalWrt 25.12.2 Rootfs & SuKiSU Module Zip
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout x-route repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies & ARM64 Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex gawk cpio kmod \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev python3 rsync unzip zip file wget curl \
            zstd xz-utils e2fsprogs qemu-utils shellcheck

      - name: Lint
        run: sh scripts/lint.sh

      - name: Build Kernel (Image, Linux 6.12.103 + Gunyah pVM config)
        run: bash scripts/build-kernel.sh

      - name: Build Rootfs (ImmortalWrt 25.12.2 ImageBuilder)
        run: bash scripts/build-rootfs.sh

      - name: Package SuKiSU Module (Lite & Full All-in-One Zip)
        run: bash scripts/package-module.sh

      - name: Upload Firmware & SuKiSU Module Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-route-openwrt-and-sukisu-module
          path: |
            dist/x-route-sukisu-*.zip
            dist/openwrt/Image
            dist/openwrt/openwrt-rootfs.img.gz
            dist/openwrt/openwrt.qcow2
            dist/openwrt/sha256sums.txt
          if-no-files-found: error

      - name: Read Module Metadata
        id: meta
        run: |
          VER="$(awk -F= '/^version=/{print $2}' module/module.prop | tr -d '\r ')"
          NAME="$(awk -F= '/^name=/{print substr($0, index($0,$2))}' module/module.prop | tr -d '\r')"
          AUTHOR="$(awk -F= '/^author=/{print $2}' module/module.prop | tr -d '\r ')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "author=${AUTHOR}" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}-build.${{ github.run_number }}
          name: "${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} (Build #${{ github.run_number }} by ${{ steps.meta.outputs.author }})"
          prerelease: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/x-route-sukisu-*.zip
            dist/openwrt/Image
            dist/openwrt/openwrt-rootfs.img.gz
            dist/openwrt/openwrt.qcow2
            dist/openwrt/sha256sums.txt
