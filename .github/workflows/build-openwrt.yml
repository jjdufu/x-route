name: Build ImmortalWrt ARM64 (OnePlus 13 Gunyah & QEMU)

on:
  push:
    branches:
      - main
    paths:
      - 'openwrt-config/**'
      - 'module/**'
      - 'scripts/**'
      - '.github/workflows/build-openwrt.yml'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: fast (ImageBuilder + Kernel, ~6 min) or full (Source, ~60 min)'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - full
      immortalwrt_release:
        description: 'ImmortalWrt release version (for fast mode)'
        required: true
        default: '24.10.6'

permissions:
  contents: write

jobs:
  build-openwrt:
    name: Build Minimal ImmortalWrt & Full SuKiSU Module Zip
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout x-route repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies & ARM64 Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk bc \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gettext git libncurses5-dev libssl-dev libelf-dev \
            python3-setuptools python3-pyelftools rsync \
            swig unzip zip zlib1g-dev file wget curl qemu-utils zstd xz-utils cpio kmod

      - name: Build ImmortalWrt Kernel (Image) & Minimal Rootfs
        run: |
          chmod +x scripts/build-openwrt.sh
          ./scripts/build-openwrt.sh \
            --mode "${{ inputs.build_mode || 'fast' }}" \
            --release "${{ inputs.immortalwrt_release || '24.10.6' }}" \
            --jobs "$(nproc)"

      - name: Package SuKiSU Module (Lite & Full All-in-One Zip)
        run: |
          chmod +x scripts/package-module.sh
          ./scripts/package-module.sh

      - name: Upload Firmware & SuKiSU Module Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-route-openwrt-and-sukisu-module
          path: |
            dist/x-route-sukisu-*.zip
            dist/openwrt/Image
            dist/openwrt/openwrt-rootfs.img.gz
            dist/openwrt/openwrt.qcow2
            dist/openwrt/sha256sums.txt
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: "x-route v1.0.0 (Build #${{ github.run_number }} - All-in-One SuKiSU Module & ImmortalWrt ARM64)"
          body: |
            ### x-route All-in-One SuKiSU Module & Custom ImmortalWrt ARM64 Firmware
            - **One-Click Flashable Module**: `x-route-sukisu-full-v1.0.0.zip` (includes SuKiSU scripts, WebUI, 4-Layer Keep-Alive & compiled OpenWrt `Image` + `openwrt-rootfs.img.gz`)
            - **Lite Module**: `x-route-sukisu-lite-v1.0.0.zip`
            - **Target**: `armsr/armv8` (Linux 6.6)
            - **OnePlus 13 (SM8750) Gunyah pVM Adaptation**: `CONFIG_DMA_RESTRICTED_POOL=y`, `CONFIG_SWIOTLB=y`
            - **Built-in Drivers**: `virtio-net`, `virtio-blk`, `virtio-pci`, `virtio-fs`, `virtio-9p`, `tun`, `nftables`, `iptables`, `8250` (`ttyS0`) + `PL011` (`ttyAMA0`)
            - **Pre-installed Packages**: `luci` (zh-cn), `dnsmasq-full`, `firewall4` (`nftables` + `TTL=64` anti-detection), `openvpn-openssl` + `luci-app-openvpn`, `openlist` + `luci-app-openlist`, `ttyd`
            - **Default LAN**: `192.168.100.1/24` (`eth1` / MAC `52:54:00:12:34:57`)
            - **Default WAN**: `172.16.1.2/24` -> Gateway `172.16.1.1` (`eth0` / MAC `52:54:00:12:34:56`)
          files: |
            dist/x-route-sukisu-*.zip
            dist/openwrt/Image
            dist/openwrt/openwrt-rootfs.img.gz
            dist/openwrt/openwrt.qcow2
            dist/openwrt/sha256sums.txt
