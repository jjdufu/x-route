# XRouter 配置（/data/adb/xrouter/config/config.conf）
# 请通过 WebUI 或 `sh /data/adb/modules/xrouter/scripts/xr set KEY VALUE` 修改，会做取值校验。
# 网络
XR_NET_PREFIX="172.29.233"
XR_VM_MAC="52:54:00:1d:e9:fe"
XR_DNS="223.5.5.5 119.29.29.29"
XR_EXPOSE="lan"
XR_MODE="global"
# 热点交给 OpenWrt 分配地址（热点网卡与虚拟机第二块网卡桥接），改后立即生效
XR_HOTSPOT_BRIDGE="1"
# 热点网关地址（地址/掩码）：桥接时 OpenWrt 用这个固定网段发地址，不跟随安卓随机网段；默认 172.28.222.254/24，设为空 = 跟随安卓
XR_HOTSPOT_SUBNET="172.28.222.254/24"
# VM
VM_CPUS="2"
VM_MEM_MB="768"
VM_SWIOTLB_MB="64"
VM_NET="1"
VM_DISK_RW="1"
VM_DISK_SIZE_MB="1024"
VM_WAKELOCK="1"
# 共享
VM_SHARE="0"
VM_SHARE_MODE="ro"
VM_SHARE_PATH="/data/media/0"
# 启动与熔断
AUTOSTART="0"
AUTOSTART_DELAY_SEC="60"
READY_TIMEOUT_SEC="180"
STABLE_SEC="180"
# 通知：收起时显示哪种累计流量（total 总流量 / wan 公网 / lan 内网），改后立即生效
XR_NOTIFY_TRAFFIC="total"
# 调试模式：打开后每条网络命令、路由判断与网络快照写入 log/debug.log；XR_DEBUG_HOURS 小时后自动关闭（0 不自动关闭）
XR_DEBUG="0"
XR_DEBUG_HOURS="24"
# 内嵌分流管理（OpenClash zashboard，纯内部 hvc1 通道）：0 关闭 / 1 开启
XR_CLASH_UI="0"
