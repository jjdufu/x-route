# ==============================================================================
# x-route SuKiSU Module Configuration
# Path at runtime: /data/adb/x-route/config/config.conf
# ==============================================================================

# 1. Core Router & Virtualization Engine Settings
ROUTER_ENABLED="1"
VM_BACKEND="auto"
VM_CPUS="2"
VM_MEM_MB="256"

# 2. Network Topology Settings
WAN_SUBNET="172.16.1"
WAN_HOST_IP="172.16.1.1"
WAN_VM_IP="172.16.1.2"
LAN_SUBNET="192.168.100"
LAN_GW_IP="192.168.100.1"
LAN_HOST_IP="192.168.100.2"

# 3. Traffic Takeover Modes
# HOTSPOT_BRIDGE_ENABLED: Automatically bridge Android Wi-Fi Hotspot (ap0/wlan1) to OpenWrt LAN
HOTSPOT_BRIDGE_ENABLED="1"
# HOST_REDIRECT_ENABLED: Route phone's own local app traffic & DNS through OpenWrt (192.168.100.1)
HOST_REDIRECT_ENABLED="1"

# 4. Host NAS Storage Passthrough (/data/media/0/NAS -> OpenWrt /mnt/nas)
NAS_MOUNT_ENABLED="1"
NAS_HOST_PATH="/data/media/0/NAS"

# 5. Four-Layer Kernel Keep-Alive Engine
KEEPALIVE_ENABLED="1"
KEEPALIVE_INTERVAL_SEC="25"
KEEPALIVE_PACKAGES="com.leohao.android.alistlite"

# 6. Power & Thermal Protection (OnePlus 13)
WAKELOCK_ENABLED="1"
BYPASS_CHARGE_ENABLED="0"
BYPASS_CHARGE_START_LEVEL="60"
BYPASS_CHARGE_STOP_LEVEL="70"
