<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XRouter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">XR</div>
      <h1>XRouter</h1>
    </div>
    <span id="env-badge" class="badge">检测中</span>
  </header>

  <div id="trip-bar" class="card alert hidden">
    <div>上次启动后整机复位，自启已关闭。</div>
    <button id="btn-ack" class="btn btn-danger">确认</button>
  </div>
  <div id="toast" class="toast hidden"></div>

  <main class="container">
    <section id="page-home" class="page">
      <div class="card">
        <div class="card-header">
          <span class="card-title">状态</span>
          <span id="vm-pill" class="pill">-</span>
        </div>
        <dl class="kv">
          <dt>运行状态</dt><dd id="st-vm">-</dd>
          <dt>已运行时长</dt><dd id="st-uptime">-</dd>
          <dt>当前网络</dt><dd id="st-up">-</dd>
        </dl>
      </div>
      <div class="card">
        <div class="row">
          <button id="btn-start" class="btn btn-primary">启动</button>
          <button id="btn-stop" class="btn">停止</button>
        </div>
        <label class="switch"><input type="checkbox" data-key="AUTOSTART" id="cb-autostart" /> 开机自动启动</label>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">管理界面</span></div>
        <a id="lnk-luci" class="luci" href="#" target="_blank">LuCI</a>
      </div>
    </section>

    <section id="page-link" class="page hidden">
      <div class="card">
        <div class="card-header"><span class="card-title">OpenVPN</span></div>
        <div class="row">
          <button id="btn-ovpn" class="btn btn-primary">上传并启用</button>
          <input id="in-ovpn" type="file" accept=".ovpn,.conf,text/plain" hidden />
        </div>
        <dl class="kv">
          <dt>连接状态</dt><dd id="st-vpn">-</dd>
          <dt>已接入的网段</dt><dd id="vpn-active">-</dd>
        </dl>
      </div>
    </section>

    <section id="page-logs" class="page hidden">
      <div class="card">
        <div class="log-tabs" id="log-tabs">
          <button type="button" class="tab on" data-log="module">模块</button>
          <button type="button" class="tab" data-log="console">控制台</button>
          <button type="button" class="tab" data-log="ctl">控制通道</button>
          <button type="button" class="tab" data-log="vmm">虚拟机管理器</button>
        </div>
        <div class="card-header">
          <span class="card-title" id="log-title">模块</span>
        </div>
        <pre id="log-box" class="log">（空）</pre>
        <div class="row">
          <button id="btn-export-one" class="btn">导出当前</button>
          <button id="btn-export-all" class="btn btn-primary">导出全部</button>
        </div>
      </div>
    </section>

    <section id="page-settings" class="page hidden">
      <div class="card">
        <div class="card-header"><span class="card-title">运行模式</span></div>
        <div class="seg" id="mode-seg">
          <button type="button" id="btn-mode-global" class="seg-btn" data-mode="global">全局</button>
          <button type="button" id="btn-mode-bypass" class="seg-btn" data-mode="bypass">旁路</button>
        </div>
      </div>
      <div class="card">
        <label class="field">谁可以访问
          <div class="cselect" id="sel-expose" data-key="XR_EXPOSE"></div>
        </label>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">共享手机存储</span></div>
        <label class="switch"><input type="checkbox" data-key="VM_SHARE" /> 开启</label>
        <label class="field">权限
          <div class="cselect" id="sel-share-mode" data-key="VM_SHARE_MODE"></div>
        </label>
        <label class="field">路径
          <input type="text" data-key="VM_SHARE_PATH" id="in-share-path" />
        </label>
      </div>
      <div class="card">
        <div class="grid">
          <label class="field">CPU<input type="number" min="1" max="4" data-key="VM_CPUS" /></label>
          <label class="field">内存（MB）<input type="number" min="384" max="2048" step="64" data-key="VM_MEM_MB" /></label>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">系统盘</span></div>
        <div class="row disk">
          <input id="in-expand" type="number" min="512" max="16384" step="256" value="2048" />
          <span class="unit">MB</span>
          <button id="btn-expand" class="btn">扩展系统盘</button>
        </div>
        <div class="row">
          <button id="btn-reset" class="btn btn-danger">重置系统盘</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button type="button" class="nav on" data-page="home">主页</button>
    <button type="button" class="nav" data-page="link">互联</button>
    <button type="button" class="nav" data-page="logs">日志</button>
    <button type="button" class="nav" data-page="settings">设置</button>
  </nav>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <p id="modal-text"></p>
      <div class="row">
        <button type="button" id="modal-cancel" class="btn">取消</button>
        <button type="button" id="modal-ok" class="btn btn-primary">确认</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
